<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>五條家本邸 — 고죠 본가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Shippori+Mincho:wght@600&display=swap">
<style>
:root{
  --dock:#101318; --dock-2:#1a1f26; --line:rgba(255,255,255,.09);
  --fg:#eef1f4; --fg-2:#9aa3ae; --fg-3:#6c7682;
  --ice:#8fd0ff; --ice-2:#c7e8ff;
  --ink:#11151b; --halo:#f7f9fb;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-serif:"Noto Serif KR","Apple Myungjo",serif; --f-jp:"Shippori Mincho","Noto Serif KR",serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme:light }}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#d7dfe7;color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}

/* title over the scene */
.head{position:fixed;top:calc(var(--safe-t) + 16px);left:calc(env(safe-area-inset-left,0px) + 18px);right:76px;pointer-events:none;color:var(--ink);
  text-shadow:0 0 2px var(--halo),0 0 6px var(--halo),0 0 14px rgba(247,249,251,.8)}
.kicker{margin:0;font-family:var(--f-jp);font-size:12px;letter-spacing:.42em;opacity:.8}
#place{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;margin-top:4px;text-align:left;text-shadow:inherit;max-width:100%}
#where{font-family:var(--f-serif);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.01em}
#place svg{flex:none;width:18px;height:18px;opacity:.7}
body.night .head{color:#f2f5f8;--halo:#0b0f15;text-shadow:0 0 2px #0b0f15,0 0 8px rgba(8,11,16,.9)}

/* round icon buttons */
.ibtn{position:fixed;top:calc(var(--safe-t) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);width:44px;height:44px;border-radius:50%;background:var(--dock);color:var(--fg);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ibtn svg{width:20px;height:20px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);width:min(640px,calc(100vw - 20px));display:flex;flex-direction:column;gap:6px}
.bar{background:var(--dock);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.28);color:var(--fg-2)}
.modes{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:4px}
.modes::-webkit-scrollbar,.sub::-webkit-scrollbar{display:none}
.modes button{flex:1 0 auto;min-width:54px;min-height:52px;padding:6px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;position:relative}
.modes b{font-weight:700;font-size:15px;color:var(--fg-2);letter-spacing:.01em}
.modes small{font-size:10.5px;color:var(--fg-3);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--dock-2)}
.modes button[aria-pressed="true"] b{color:#fff}
.modes button[aria-pressed="true"] small{color:var(--ice)}
.modes .sep{flex:none;width:1px;margin:12px 2px;background:var(--line)}
.modes .under b{color:#b9a993}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px}
.sub[hidden]{display:none}
.sub button{flex:none;padding:9px 14px;border-radius:12px;font-size:13.5px;color:var(--fg-2);background:transparent;border:1px solid var(--line);white-space:nowrap}
.sub button[aria-pressed="true"]{color:var(--dock);background:var(--ice-2);border-color:var(--ice-2);font-weight:700}

/* sheet */
.sheet{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(var(--safe-t) + 70px);width:380px;max-height:calc(100vh - var(--safe-t) - var(--safe-b) - 190px);overflow:auto;background:var(--dock);color:var(--fg);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:18px 20px 20px;
  opacity:0;transform:translateY(8px);transition:opacity .22s ease,transform .22s ease;overscroll-behavior:contain}
.sheet.open{opacity:1;transform:none}
.grab{display:none}
.sheet .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);background:var(--dock-2)}
.sheet .x svg{width:14px;height:14px}
.s-meta{margin:0 44px 0 0;font-family:var(--f-jp);font-size:12.5px;color:var(--ice);letter-spacing:.14em;white-space:pre}
.s-title{margin:4px 44px 0 0;font-family:var(--f-serif);font-weight:700;font-size:22px;line-height:1.3;color:#fff}
.s-text{margin:12px 0 0;font-family:var(--f-serif);font-weight:600;font-size:15.5px;line-height:1.9;color:#e3e7ec;letter-spacing:-.005em}
.s-world{margin:12px 0 0;padding:11px 13px;border-radius:12px;background:var(--dock-2);font-family:var(--f-serif);font-weight:600;font-size:14.5px;line-height:1.8;color:#d6dbe1}
.s-world b{display:block;font-size:11.5px;color:var(--ice);margin-bottom:2px}
.s-ih{margin:20px 0 0;font-size:11.5px;letter-spacing:.12em;color:var(--fg-3)}
.s-items{margin:8px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.s-items li{padding:12px 0;border-bottom:1px solid var(--line)}
.s-items b{display:block;font-size:14px;color:#fff}
.s-items span{display:block;margin-top:4px;font-family:var(--f-serif);font-weight:600;font-size:14px;line-height:1.8;color:var(--fg-2)}
.s-rows{margin:14px 0 0}
.s-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;border-bottom:1px solid var(--line);font-size:15px;color:var(--fg)}
.sw{width:44px;height:26px;border-radius:13px;background:#2a313a;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd6de;transition:transform .2s}
.s-row[aria-checked="true"] .sw{background:var(--ice)}
.s-row[aria-checked="true"] .sw::after{transform:translateX(18px);background:#fff}
.seg{display:flex;margin-top:16px;padding:4px;border-radius:12px;background:var(--dock-2)}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--dock);font-weight:700}
.s-note{margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--fg-3)}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 104px);background:rgba(16,19,24,.82);color:var(--fg);font-size:13px;padding:8px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.gone{opacity:0}

/* tour button under the title */
#tourBtn{pointer-events:auto;margin-top:10px;display:flex;width:max-content;align-items:center;gap:8px;padding:9px 14px 9px 11px;border-radius:999px;background:var(--dock);color:var(--fg);font-size:13px;font-weight:500;text-shadow:none;box-shadow:0 6px 18px rgba(0,0,0,.22)}
#tourBtn svg{width:16px;height:16px;color:var(--ice)}
/* chapter card */
.chapter{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse at center,rgba(8,11,16,.55) 0%,rgba(8,11,16,.25) 45%,rgba(8,11,16,0) 75%)}
.chapter.on{opacity:1}
.chapter .in{text-align:center;color:#fff;padding:0 28px;transform:translateY(8px);transition:transform 1.2s ease}
.chapter.on .in{transform:none}
.chapter .ck{font-family:var(--f-jp);font-size:14px;letter-spacing:.6em;color:var(--ice-2);margin:0 0 0 .6em}
.chapter .ct{margin:10px 0 0;font-family:var(--f-serif);font-weight:700;font-size:40px;letter-spacing:.02em;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.chapter .ce{margin:14px auto 0;max-width:420px;font-family:var(--f-serif);font-weight:600;font-size:16px;line-height:1.7;color:#e3e8ee;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.chapter .ce::before{content:"";display:block;width:28px;height:1px;background:rgba(255,255,255,.6);margin:0 auto 14px}
/* tour captions */
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);width:min(720px,calc(100vw - 20px));background:rgba(12,15,20,.94);color:#fff;border-radius:20px;padding:18px 22px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.who{margin:0;display:flex;align-items:baseline;gap:8px}
.who b{font-family:var(--f-serif);font-size:14px;color:var(--ice-2)}
.who span{font-size:11.5px;color:var(--fg-3)}
.tline{margin:8px 0 0;min-height:3.6em;font-family:var(--f-serif);font-weight:600;font-size:17px;line-height:1.8;color:#f1f3f6;opacity:0;transform:translateY(4px)}
.tline.in{animation:tl .9s ease forwards}
@keyframes tl{to{opacity:1;transform:none}}
.tctl{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.tctl button{min-height:40px;padding:0 12px;border-radius:10px;font-size:13.5px;color:var(--fg-2)}
.tctl button:disabled{opacity:.35}
.tctl #tNext{color:#fff;font-weight:700}
.tctl #tPlay{width:40px;padding:0;display:grid;place-items:center}
.tctl #tPlay svg{width:16px;height:16px}
.tctl #tPlay[data-p="1"] .pl,.tctl #tPlay[data-p="0"] .pa{display:none}
.tctl #tourStep{font-size:12px;color:var(--fg-3);margin:0 6px;font-variant-numeric:tabular-nums}
.tctl #tEnd{margin-left:auto}
.tctl #tChap{color:var(--ice-2)}
body.touring .dock,body.touring #settings,body.touring #tourBtn,body.touring .hint,body.touring #place svg{display:none}
/* map pins */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .28s ease;will-change:transform,opacity}
.lb.on{opacity:1}
.lb span{font:700 12px/1.3 var(--f-ui);color:#11151b;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff,0 0 8px rgba(255,255,255,.9)}
.lb b{width:1px;height:8px;background:rgba(17,21,27,.45);margin-top:2px}
.lb i{width:8px;height:8px;border-radius:50%;background:#2f9be6;box-shadow:0 0 0 2px #fff}
.lb.big span{font:700 14.5px/1.3 var(--f-serif)}
.lb.big b{height:14px}
.lb.big i{background:#11151b}
body.night .lb span{color:#f2f5f8;text-shadow:0 0 2px #0b0f15,0 0 4px #0b0f15,0 0 8px rgba(8,11,16,.9)}
body.night .lb b{background:rgba(242,245,248,.5)}
body.night .lb i{background:var(--ice);box-shadow:0 0 0 2px #0b0f15,0 0 10px rgba(143,208,255,.8)}
body.night .lb.big i{background:#f2f5f8}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:#101318;color:#cfd6de;transition:opacity .7s}
.loading .t{text-align:center}
.loading .k{font-family:var(--f-jp);font-size:13px;letter-spacing:.5em;color:var(--ice)}
.loading .m{margin-top:10px;font-size:14px;color:var(--fg-2)}
.loading.done{opacity:0;pointer-events:none}
.err{max-width:420px;text-align:center;font-size:14px;line-height:1.7;padding:24px}

@media (max-width:760px){
  .chapter .ct{font-size:32px}.chapter .ce{font-size:15px}
  .tour{bottom:calc(var(--safe-b) + 8px);width:calc(100vw - 16px);padding:16px 18px 10px}
  .tline{font-size:16px}
  .tctl button{padding:0 7px;font-size:13px}
  .tctl #tourStep{display:none}
  #tourBtn{margin-top:8px;padding:8px 12px 8px 10px}
  .head{left:16px;top:calc(var(--safe-t) + 12px)}
  #where{font-size:22px}
  .kicker{font-size:11px}
  .dock{width:calc(100vw - 16px);bottom:calc(var(--safe-b) + 8px)}
  .modes{padding:3px}
  .modes button{flex:1 1 0;min-width:0;padding:6px 1px 8px;min-height:50px}
  .modes b{font-size:14px}
  .modes small{font-size:9.5px}
  .modes .sep{display:none}
  .sheet{left:8px;right:8px;width:auto;top:auto;bottom:calc(var(--safe-b) + 84px);max-height:52vh;border-radius:20px;padding:10px 18px 20px}
  .sheet.with-sub{bottom:calc(var(--safe-b) + 138px);max-height:46vh}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:#3a424c;margin:0 auto 10px}
  .sheet .x{top:14px}
  .s-title{font-size:20px}
  .hint{bottom:calc(var(--safe-b) + 92px)}
  .lb span{font-size:11px}.lb.big span{font-size:13px}
}
@media (prefers-reduced-motion: reduce){.sheet,.hint,.loading,.lb,.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<div id="view" aria-label="고죠 본가 3D 모델"></div>
<div id="labels" aria-hidden="true"></div>

<header class="head">
  <p class="kicker">五條家本邸</p>
  <button id="place" aria-label="이 공간의 이야기 보기"><span id="where">저택 전체</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6.2v.1" stroke-linecap="round"/></svg></button>
<button id="tourBtn"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>야나기의 안내로 둘러보기</button>
</header>
<button class="ibtn" id="settings" aria-label="보기 설정"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h2M8 14h9"/><circle cx="13.5" cy="6" r="1.8"/><circle cx="6.5" cy="14" r="1.8"/></svg></button>

<nav class="dock" aria-label="보는 범위">
  <div class="sub bar" id="sub" hidden>
    <button data-m="b:seogo" aria-pressed="false">서고 별채</button>
    <button data-m="b:uirye" aria-pressed="false">의례 별채</button>
    <button data-m="b:guest" aria-pressed="false">귀빈 별채</button>
    <button data-m="b:onsen" aria-pressed="false">온천동</button>
    <button data-m="b:garage" aria-pressed="false">차고·마구간</button>
    <button data-m="b:staff" aria-pressed="false">관리·경비동</button>
    <button data-m="b:gate" aria-pressed="false">정문</button>
  </div>
  <div class="modes bar">
    <button data-m="ext" aria-pressed="true"><b>외관</b><small>전체</small></button>
    <span class="sep" aria-hidden="true"></span>
    <button data-m="3F" aria-pressed="false"><b>3F</b><small>손님</small></button>
    <button data-m="2F" aria-pressed="false"><b>2F</b><small>가족</small></button>
    <button data-m="1F" aria-pressed="false"><b>1F</b><small>접객</small></button>
    <button data-m="B1" class="under" aria-pressed="false"><b>B1</b><small>휴식</small></button>
    <button data-m="B2" class="under" aria-pressed="false"><b>B2</b><small>보안</small></button>
    <span class="sep" aria-hidden="true"></span>
    <button data-m="x" aria-pressed="false"><b>펼침</b><small>층 분해</small></button>
    <button id="bMore" aria-pressed="false" aria-expanded="false"><b>별채</b><small id="bMoreName">건물</small></button>
  </div>
</nav>
<div class="hint" id="hint"></div>
<div class="chapter" id="chapter" hidden aria-live="polite"><div class="in"><p class="ck"></p><p class="ct"></p><p class="ce"></p></div></div>
<div class="tour" id="tour" hidden role="region" aria-label="야나기의 안내">
  <p class="who"><b>야나기</b><span>고죠 본가의 집사</span></p>
  <p class="tline" id="tourLine" aria-live="polite"></p>
  <div class="tctl">
    <button id="tPrev">이전</button>
    <button id="tPlay" data-p="1" aria-label="멈춤"><svg class="pa" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2.5" width="3.5" height="11" rx="1"/><rect x="9.5" y="2.5" width="3.5" height="11" rx="1"/></svg><svg class="pl" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <span id="tourStep"></span>
    <button id="tNext">다음</button>
    <button id="tChap">다음 장</button>
    <button id="tEnd">끝내기</button>
  </div>
</div>

<aside class="sheet" id="sheet" hidden aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <button class="x" id="sheetX" aria-label="닫기"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  <div id="sheetBody"></div>
</aside>

<div class="loading" id="loading"><div class="t"><div class="k">五條家本邸</div><div class="m" id="loadMsg">눈 덮인 본가를 짓는 중</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.OrbitControls){$('#loadMsg').innerHTML='<div class="err">3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 페이지를 새로 고쳐 주세요.</div>';return}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OX=92,OZ=100,D2R=Math.PI/180;
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const rr=(a,b)=>a+(b-a)*rnd();const pick=a=>a[Math.floor(rnd()*a.length)];

/* ───────── floor plans (1 unit = 1 m; x → east, y → south) ───────── */
function R(id,n,z,x,y,w,h,o){return Object.assign({id,n,z,x,y,w,h},o||{})}
function D(x,y,o,w,k){return {x,y,o,w:w||1.2,k:k||'door'}}
const FL={
B2:{name:'지하 2층',sub:'보안·수장 구역',elev:-9,h:3.6,
 desc:'바깥에서는 존재가 거의 드러나지 않는 층. 가보를 모신 수장고와 문서 보관실, 금고, 보안 통제실, 비상 전원이 있어요. 가족 코어는 비상 대피 공간으로만 열려요.',
 rooms:[R('b2-1','수장고 (미술품·가보)','security',14,14,12,16,{note:'대대로 내려온 갑주와 도검, 병풍과 서화를 온습도에 맞춰 보관해요.'}),
  R('b2-2','중요 문서 보관실','security',26,14,8,12,{note:'이동식 서가에 재산·계약 기록을 보관해요.'}),
  R('b2-3','비상 대피 공간','family',34,14,8,12,{note:'가족 코어와 바로 이어지고 비상 전원·통신·물자가 갖춰져 있어요.'}),
  R('b2-4','보안 복도','security',26,26,16,4,{hall:1}),

  if(!(o.userData.dyn&&o!==src))o.children.forEach(visit)};

 buckets.forEach(b=>{const P=new Float32Array(b.n*3),N=new Float32Array(b.n*3),U=new Float32Array(b.n*2);let k=0;
  b.list.forEach(([o,gr])=>{const geo=o.geometry,idx=geo.index,pos=geo.attributes.position,nor=geo.attributes.normal,uv=geo.attributes.uv;const mw=o.matrixWorld;nm.getNormalMatrix(mw);
   for(let i=gr.start;i<gr.start+gr.count;i++){const vi=idx?idx.getX(i):i;v.fromBufferAttribute(pos,vi).applyMatrix4(mw);P[k*3]=v.x;P[k*3+1]=v.y;P[k*3+2]=v.z;

 'f2-1':'겨울 선룸','f2-2':'미오의 서재','f2-3':'사토루의 서재','f2-4':'부부 욕실·드레스룸','f2-7':'유키토의 방','f2-9':'둘째를 위한 방','f2-10':'놀이·독서방','f2-13':'유키토 돌봄실',
 'f2-16':'남측 가족 복도','f2-18':'세탁실','f2-22':'높은 방','f2-24':'북측 테라스','f3-3':'귀빈 스위트','f3-4':'손님 방 A','f3-7':'손님 방 B','f3-5':'손님 라운지','f1-16':'코트룸'};
ORDER.forEach(fid=>FL[fid].rooms.forEach(r=>{if(RENAME[r.id])r.n=RENAME[r.id]}));
const CORE={family:{m:'가족 승강기와 계단. 지하 2층부터 2층까지만 오가고 3층에는 서지 않는다.'},guest:{m:'손님 승강기는 1층과 3층에만 선다. 2층에는 문이 없어서, 3층 손님이 가족 공간으로 내려올 길은 없다.'},staff:{m:'직원은 이 계단과 서비스 승강기로만 움직인다. 첫째 규칙은 ‘가족 눈에 띄지 않게 움직인다’이다.'}};
const STORY={
 'b2-1':{m:'그림과 도자기, 갑옷을 모신 곳. 온도와 습도가 사계절 같다. 사토루는 어릴 적 숨바꼭질을 하다 여기서 잠들어 반나절 동안 아무도 찾지 못했다.',a:'병풍과 서화는 해마다 한 번 바람을 쐬어 다시 들인다.',y:'갑옷 옆 도검이 장식만은 아니라는 소문이 있다. 야나기는 확인해 주지 않는다.',it:[['초대 당주의 투구','어린 사토루가 이걸 쓰고 뛰어다니다 크게 혼났다. 유키토도 곧 그럴 것이다.'],['금괴 진열장','가문의 재산 가운데 눈에 보이는 아주 작은 일부.']]},
 'b2-2':{m:'이동식 서가에 가문의 기록을 보관한다. 가장 새 족보는 사토루가 직접 썼고, ‘유키토’ 세 글자는 몇 번이나 다시 썼다.',a:'사백 년 치 족보와 가문의 결정들이 있다.',y:'조직의 장부와 약속들이 있다. 이 방의 서류는 밖으로 나가지 않는다.'},
 'b2-3':{m:'가족 승강기와 곧장 이어지는 방. 사흘 치 물자와 분유, 기저귀가 있다. 야나기가 매달 첫날 점검한다. 쓸 일이 없기를 바란다.'},
 'b2-4':{m:'지하 2층의 방들을 잇는 복도. 문마다 잠금장치가 있다.'},
 'b2-5':{m:'저택 전체를 비추는 화면 마흔 개. 2층에만 카메라가 없다.',y:'경비는 여섯 시간마다 교대하고, 교대 기록은 야나기가 직접 확인한다.',it:[['규칙','화면에 동그란 발자국이 지나가도 쫓지 않는다.']]},
 'b2-6':{m:'열쇠는 사토루와 야나기가 하나씩 가지고 있다.',a:'토지 문서와 당주 인장의 사본이 들어 있다.',y:'맨 아래 칸에는 유키토 돌잔치 때 받은 금반지들이 있다.'},
 'b2-7':{m:'비상 전원은 폭설로 길이 끊겨도 사흘을 버틴다. 겨울이면 직원 한 명이 매일 아침 이 방부터 둘러본다.'},
 'b1-1':{m:'사토루의 운동실이지만 매트를 가장 많이 쓰는 건 유키토다. 아버지가 팔굽혀펴기를 하면 등에 올라탄다. 한 살 아기 무게가 더해지는 게 운동이 된다고 사토루는 말한다.'},
 'b1-2':{m:'금요일 밤은 가족 영화의 밤이고, 영화는 늘 미오가 고른다. 사토루는 중간쯤 설표가 되어 미오 발치에서 잠들고, 요즘은 유키토도 그 옆에서 잔다.',it:[['뒷줄 담요 세 장','큰 것, 작은 것, 털이 잔뜩 묻은 것.'],['팝콘 기계','유키토 몫은 아직 없다. 사토루가 몰래 한 알씩 준다.']]},
 'b1-3':{m:'온도와 습도를 따로 맞춘 저장고.',y:'조직 어른들과 나누는 술은 모두 여기서 나간다.',it:[['미오의 와인 한 상자','미오가 시집온 해의 와인. 유키토가 스무 살 되는 날 열기로 했다.'],['오크통','작년에 들인 통에는 ‘유키토’ 이름표가 붙었다.']]},
 'b1-4':{m:'2층 서재가 넘쳐 내려온 미오의 책과 영화. 상자마다 미오 글씨의 이름표가 붙어 있다.'},
 'b1-5':{m:'운동실과 시네마, 저장고를 잇는 복도.'},'b1-7':{m:'수영장과 놀이터, 차고를 잇는 복도.'},'b1-12':{m:'스파와 가족 승강기를 잇는 복도.'},
 'b1-6':{m:'온수 수영장. 북쪽 유리 너머로 눈 쌓인 대나무 정원이 보인다.',it:[['노란 오리 튜브','유키토의 첫 튜브. 사토루가 고른 표범 무늬를 미오가 조용히 바꾸었다.']]},
 'b1-8':{m:'눈 때문에 밖에 못 나가는 날의 놀이터. 유키토는 경사로를 꼭 거꾸로 오른다.'},
 'b1-9':{m:'설표를 위한 서늘하고 호화로운 방. 여름이면 사토루가 좀처럼 나오지 않는다.',y:'그림 속 산은 지금 고죠 가의 땅이다.',it:[['설산 그림','벽 한 면의 대형 그림. 사토루가 어릴 적 처음 설표가 되었던 산이다.'],['설산 나무','산에서 쓰러진 나무를 다듬어 세운, 천장까지 닿는 기둥.'],['얼음 물웅덩이','수온 4도. 여름이면 사토루가 앞발을 담근다. 유키토는 손을 넣어 보고 딱 한 번으로 끝냈다.'],['차가운 돌','설표가 배를 대고 눕는 돌. 산에서 가져와 바닥에 묻었다.']]},
 'b1-10':{m:'가족 차는 전용 램프로 들어와 곧장 가족 승강기로 올라간다. 가족 차 창문의 작은 손자국은 닦지 말라는 게 사토루의 지시다.',y:'차는 모두 방탄이다.'},
 'b1-11':{m:'큰 탕은 어른들 것, 미지근한 작은 탕은 유키토 것. 유리문을 열면 노천탕으로 이어진다.'},
 'b1-14':{m:'온천수와 수영장 물을 데우고 거르는 설비. 노천탕의 두 가지 온도도 여기서 맞춘다.'},
 'b1-16':{m:'지하에서 일하는 직원들이 쉬는 방. 직원의 동선은 가족의 동선과 한 번도 겹치지 않는다.'},
 'b1-17':{m:'선큰 정원 속 데크. 머리 위를 2층 테라스가 지붕처럼 덮어, 눈 오는 날에도 탕에 앉아 있을 수 있다.'},
 'b1-18':{m:'스파에서 이어지는 탕. 유키토가 태어난 뒤 한쪽을 얕게 파고 38도로 맞췄다. 나머지는 40도.'},
 'f1-1':{m:'서쪽 문을 나서면 지붕 얹은 회랑이 서고와 의례 별채로 이어진다.',a:'가문 회의가 있는 날엔 이 방에서 어른들의 외투를 받는다.',y:'지부 어른들이 모이는 날엔 회랑 문을 모두 잠근다.'},
 'f1-2':{m:'스무 자리 탁자. 일 년에 열 번도 쓰이지 않는다. 가장 최근엔 유키토의 돌잔치였고, 그날만은 시끄러웠다.'},
 'f1-3':{m:'손님 전용 화장실. 가족 욕실과는 수건 색부터 다르다.'},
 'f1-4':{m:'연회실과 화장실, 회랑 전실을 잇는 복도. 동쪽 창으로 중정이 보인다.'},
 'f1-5':{m:'사토루가 웃지 않는 방.',a:'가훈 족자 ‘흔들리지 않는다’가 걸려 있다. 사토루는 이걸 볼 때마다 웃음을 참는다.',y:'이 방의 이야기는 방을 나가지 않는다. 벽의 칼이 뽑힌 적이 있냐고 물으면 야나기는 날씨 이야기로 말을 돌린다.'},
 'f1-6':{m:'사토루는 여기서 십 분을 못 앉아 있고, 대신 미오가 손님을 잘 대한다. 피아노는 손님이 청할 때만 열린다.'},
 'f1-7':{m:'손님은 모두 이 문으로 들어온다. 천장이 높아 발소리가 울린다. 유리 너머 중정으로 ‘정돈된 고죠 가’를 먼저 보여 준다.',it:[['꽃','매일 아침 바뀐다. 겨울엔 동백이다.']]},
 'f1-9':{m:'손님과의 식사는 여기서 한다. 가족끼리는 2층에서 따로 먹는다.'},
 'f1-11':{m:'손님 상을 차리는 주방. 남쪽 서비스 출입구로 식자재가 들어오고, 음식은 서비스 승강기로만 오르내린다.'},
 'f1-12':{m:'대현관에서 이어지는 손님의 복도. 갤러리 끝 통제문부터는 가족 공간이다.',y:'통제문 앞에 늘 한 사람이 서 있다.'},
 'f1-13':{m:'본관이 감싼 안뜰. 손님은 유리 너머로만 본다. 큰 소나무에는 겨울마다 눈 무게를 받치는 줄을 맨다.'},
 'f1-14':{m:'폭 4미터의 문은 설표 때문이다. 다리를 건너면 바로 가족 정원의 눈밭이다.',it:[['큰 수건','설표의 발을 닦는 수건. 사토루는 그 위를 꼭 세 번 밟고 지나가고, 유키토의 작은 맨발 발자국이 따라 찍힌다.']]},
 'f1-15':{m:'가족 전용 현관과 가족 승강기를 잇는 홀.',it:[['유키토의 첫 그림','원래 경매에서 들인 산수화 자리였는데, 사토루가 직접 내리고 이 그림을 걸었다. 파란 동그라미 두 개는 아버지 눈, 하얀 덩어리는 설표다.']]},
 'f1-16':{m:'외투와 유모차와 썰매가 함께 사는 방.'},
 'f1-17':{m:'대현관을 거치지 않고 2층으로 오르는 문.',it:[['신발장','큰 신발들과 손바닥만 한 신발들. 요즘 유키토는 아버지 신발에 발을 넣고 걷는 걸 좋아한다.']]},
 'f2-1':{m:'미오가 오후를 보내는 방. 설산이 정면으로 보인다.',it:[['읽다 만 책','의자 옆 탁자에 늘 엎어져 있다. 오늘은 다음 달 영화로 나오는 겨울 산 배경의 소설이다.']]},
 'f2-2':{m:'‘안주인이기 전에 한 사람으로 지낼 곳이 있어야 한다’며 사토루가 2층에서 가장 먼저 만든 방. 책장은 벌써 세 번째 늘렸다.',it:[['원작 소설 칸','영화의 원작만 모아 둔 칸. 책 사이에 영화표가 꽂혀 있고, 뒷면의 함께 본 사람 이름은 대부분 ‘사토루 (중간에 잠듦)’이다.'],['영화 포스터','한 장은 두 사람이 처음 함께 본 영화다. 사토루는 내용을 하나도 기억 못 한다. 옆자리만 보고 있었으니까.']]},
 'f2-3':{m:'고죠 가의 큰일이 정해지는 방. 그래도 결재 서류는 늘 밀려 있다.',a:'가보 진열장에는 사백 년 된 청자 다완과 당주의 인장이 있다. 인장의 두 번째 사용처는 유키토의 출생 신고서였다.',y:'이 방에 들어올 수 있는 사람은 사토루, 미오, 그리고 문을 밀 줄 알게 된 유키토뿐이다. 진열장의 칼 한 쌍 가운데 짧은 칼은 후계자의 것인데, 주인은 아직 딸랑이를 더 좋아한다.',it:[['당주의 책상','대대로 써 온 책상. 서랍엔 인장과 서류, 사탕, 그리고 맨 아래 칸엔 유키토의 그림이 있다.'],['사탕 단지','사탕을 먼저 채워야 일이 진행된다. 뚜껑은 유키토 손이 안 닿는 높이에 있다. 아직까지는.'],['책장 위 쿠션','서류가 지겨우면 설표가 되어 이리로 올라간다.']]},
 'f2-4':{m:'침실에 딸린 두 사람의 욕실과 옷방. 창가 욕조에서 설산이 보인다.'},
 'f2-5':{m:'선룸과 두 서재, 욕실을 잇는 복도.'},'f2-19':{m:'라운지와 식사실, 가족 승강기를 잇는 복도.'},
 'f2-6':{m:'유키토 방과 문으로 이어져 있고, 이 문은 밤에도 닫지 않는다. 아기 숨소리가 들려야 잠들 수 있어서다. 두 사람 다.',it:[['침대 위 인형','침대 발치의 설표 인형은 유키토 것이다. 아침마다 문을 지나 기어 와서, 꼭 인형을 먼저 던져 놓고 올라온다.'],['침대맡','미오가 금요일 영화의 원작 소설을 두는 자리.']]},
 'f2-7':{m:'유키토 전용 스위트. 부부 침실과 안쪽 문으로 이어진다.',it:[['아기 침대','처음 혼자 일어선 곳. 일어서자마자 난간을 넘으려 했다.'],['아빠의 자리','아기 침대 곁의 큰 쿠션. 밤마다 설표가 몸을 말고 누워 침대 쪽을 본다. 아기가 깨서 울면 미오보다 먼저 고개를 든다.'],['천장 가까운 자리','방 전체가 내려다보이는 높은 선반. 설표는 여기서 아이가 잠드는 걸 지켜보다가, 숨소리가 고르게 되면 소리 없이 쿠션으로 내려간다.'],['흔들의자','미오가 밤마다 동화책을 읽어 주는 의자. 요즘 유키토가 좋아하는 책은 눈 속에 사는 표범 이야기다. 그 장면이 나오면 쿠션 쪽을 가리킨다.']]},
 'f2-8':{m:'두 아이 방 사이에 있는, 기저귀와 옷을 두는 작은 방.'},
 'f2-9':{m:'아직 주인이 없다. 아기 침대와 흔들의자가 먼저 들어와 있고, 상자는 하나씩 늘어 간다.',it:[['풀지 않은 상자','유키토가 입던 옷이 들어 있다. 미오가 한 벌씩 개어 두었다. 언젠가 동생이 입을 거라며.']]},
 'f2-10':{m:'미오가 책을 읽어 주고, 유키토는 책장을 먼저 넘기려 한다.',it:[['책 읽는 텐트','유키토가 가장 좋아하는 자리. 설표까지 들어오면 텐트가 무너진다. 일주일에 두 번쯤.']]},
 'f2-12':{m:'유키토가 매일 저녁 목욕하는 욕실.',it:[['노란 오리 일곱 마리','다 있어야 목욕이 시작된다. 하나는 사토루, 하나는 미오, 나머지 다섯은 사토루가 또 사 왔다.']]},
 'f2-13':{m:'기저귀 교환대와 아기 욕조, 분유를 타는 조리대가 있다.'},
 'f2-15':{m:'침구와 수건을 두는 방. 직원은 세탁실을 거쳐서만 이곳에 온다.'},
 'f2-16':{m:'아이 방들을 잇는 긴 복도. 북쪽 창으로 중정이 내려다보인다.',it:[['작은 바퀴 자국','유키토의 전용 도로. 사토루가 고른 빨간 붕붕카를 발로 밀고 다니다가, 아무도 따라오지 않으면 돌아온다.']]},
 'f2-18':{m:'직원이 가족 구역에 드나드는 유일한 통로.',it:[['빨래 바구니','가장 작은 바구니는 늘 가득이고, 설표 털이 묻은 담요는 따로 빤다.']]},
 'f2-20':{m:'2층의 중심. 저녁이면 세 사람은 대개 벽난로 앞에 있다.',it:[['벽난로 울타리','유키토가 기기 시작한 주에 생겼다. 그전엔 설표가 졸던 자리였다. 지금은 둘이 울타리 양쪽에서 마주 보고 눕는다.'],['소파의 담요','미오가 영화를 볼 때 덮는 담요. 그 위에 늘 설표가 올라앉는다.'],['설표 전망대','라운지에서 가장 높은 자리. 그곳을 올려다보는 유키토의 눈빛이 아버지와 똑같아서 미오가 조금 걱정한다.']]},
 'f2-21':{m:'의자 셋과 아기 의자 하나. 대리석 원탁과 샹들리에가 있는 작고 화려한 방.',it:[['날아가는 숟가락','유키토의 숟가락이 바닥으로 날아가면 줍는 건 대개 사토루다. 설표일 때도.']]},
 'f2-22':{m:'벽 선반은 설표가 오르는 길, 매트 등반 코스는 유키토가 오르는 길이다.',it:[['등반 코스','두 계단에서 다섯 계단이 됐다. 매일 저녁 누가 먼저 꼭대기에 닿는지 시합이 열리고, 심판은 미오다.']]},
 'f2-24':{m:'정원으로 내려가는 계단이 유난히 완만하고 난간이 유난히 높다. 모두 유키토 때문이다.'},
 'f3-1':{m:'손님들이 가장 좋아하는 곳. 별채와 설산이 한눈에 보이지만, 가족 정원은 지붕에 가려 보이지 않는다.'},
 'f3-2':{m:'손님의 층. 가족의 흔적이 하나도 없도록 지었다.'},
 'f3-3':{m:'가장 귀한 손님이 묵는 방. 창가 욕조에서 서쪽 별채의 지붕이 내려다보인다.'},
 'f3-4':{m:'묵고 가는 손님의 객실.'},'f3-7':{m:'침대 두 개를 둔 객실. 수행원이 함께 묵을 때 쓴다.'},
 'f3-5':{m:'가족 라운지와 크기는 비슷하지만 분위기는 전혀 다르다. 장난감이 하나도 없다.'},
 'f3-9':{m:'미오가 가끔 손님과 차를 마시는 방. 시집온 뒤 배운 다도는 이제 야나기보다 잘한다.'}
};
const GARDEN={trad:{n:'전통 정원',m:'선대 당주들이 손님을 맞던 정원. 연못은 겨울이면 가장자리부터 얼고, 손질만 할 뿐 아무것도 바꾸지 않는다.'},
 fam:{n:'가족 정원',m:'본관 북쪽, 바깥에서 보이지 않는 정원. 사토루가 처음부터 다시 만들었다. 눈 위에는 큰 발자국, 작은 발자국, 동그란 설표 발자국이 늘 함께 찍힌다.',it:[['눈사람','세 사람이 함께 만들었다. 몸통은 사토루, 얼굴은 미오. 유키토는 코를 세 번 떼어 먹었다.'],['아기 썰매','대개 사토루가 끌지만, 가끔은 설표가 줄을 물고 끈다. 유키토는 그쪽을 훨씬 좋아한다.']]},
 mt:{n:'설산',m:'가문의 사유 산림이 이어지는 설산. 가족 정원과 온천동이 이 산을 바라본다.'}};

const FIRST=std(0xffffff,{roughness:.9,map:ctex(128,(x,s)=>{x.fillStyle='#fbf8f1';x.fillRect(0,0,s,s);x.fillStyle='#3d8bd9';[[.36,.36],[.62,.36]].forEach(([a,b])=>{x.beginPath();x.arc(s*a,s*b,14,0,7);x.fill()});x.fillStyle='#e9edf2';x.strokeStyle='#9aa4ad';x.lineWidth=3;x.beginPath();x.ellipse(s*.5,s*.72,40,22,0,0,7);x.fill();x.stroke()})});
const MOTTO=std(0xffffff,{roughness:.9,map:ctex(128,(x,s,h)=>{x.fillStyle='#f1e9d6';x.fillRect(0,0,s,h);x.fillStyle='#1b1a18';x.font='bold 46px serif';x.textAlign='center';x.fillText('不',s/2,h*.38);x.fillText('動',s/2,h*.62);x.fillStyle='#b23a26';x.fillRect(s*.62,h*.78,14,14)},256)});
function scrollMotto(){const g=G();bx(g,.62,1.6,.02,MOTTO,0,-.8);bx(g,.7,.04,.04,M.dark,0,.8);bx(g,.7,.04,.04,M.dark,0,-.84);g.userData.wall=1;return g}
function firstPainting(){const g=G();bx(g,1.1,.9,.05,M.walnut,0,-.45);bx(g,.95,.75,.01,FIRST,0,-.375,.03);g.userData.wall=1;return g}
function fireGuard(len){const g=G();[-1,1].forEach(s=>bx(g,.05,.7,.05,M.brass,s*len/2));bx(g,len,.04,.04,M.brass,0,.66);bx(g,len,.04,.04,M.brass,0,.1);for(let i=1;i<Math.round(len/.12);i++)bx(g,.012,.56,.012,M.brass,-len/2+i*.12,.1);return g}
function lookout(){const g=G();bx(g,1.3,.08,.9,M.oakL);cy(g,.4,.12,std(0xdfe3e7,{roughness:1}),0,.08,0,.34);[-1,1].forEach(s=>bx(g,.06,.06,.7,M.brass,s*.5,-.08,-.05));g.userData.wall=1;return g}
function candyJar(){const g=G();cy(g,.1,.2,M.glass);for(let i=0;i<8;i++)sp(g,.025,.025,.025,pick([M.red,M.yellow,M.green,M.rose,M.sky]),rr(-.05,.05),rr(.03,.15),rr(-.05,.05),GSL);cy(g,.105,.03,M.brass,0,.2);sp(g,.03,.03,.03,M.brass,0,.25,0,GSL);return g}
function rockingChair(){const g=G();[-1,1].forEach(s=>{const r=bx(g,.05,.06,1.0,M.oakL,s*.26,0,0);bx(g,.04,.5,.04,M.oakL,s*.26,.05,.3);bx(g,.04,1.0,.04,M.oakL,s*.26,.05,-.28)});bx(g,.56,.06,.52,M.oakL,0,.48,.02);bx(g,.56,.06,.48,M.cream,0,.54,.02);for(let i=0;i<5;i++)bx(g,.03,.55,.03,M.oakL,-.2+i*.1,.55,-.28);bx(g,.6,.06,.05,M.oakL,0,1.08,-.29);bx(g,.4,.04,.4,M.sage,0,.6,.0,.3);return g}
function ducks(n){const g=G();for(let i=0;i<n;i++){const d=G();sp(d,.06,.045,.07,M.yellow,0,.045,0,GSL);sp(d,.035,.035,.035,M.yellow,0,.1,.04,GSL);bx(d,.02,.012,.03,M.orange,0,.1,.08);put(g,d,(i-(n-1)/2)*.13,0,rr(-30,30))}return g}
function rideCar(){const g=G();bx(g,.32,.16,.6,M.red,0,.08);bx(g,.26,.12,.22,M.red,0,.24,-.08);bx(g,.06,.1,.04,M.char,0,.28,.12);[[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([a,b])=>hcyl(g,.06,.05,M.char,a*.17,.06,b*.2));return g}
function tracks(len){const g=G();[-1,1].forEach(s=>bx(g,.03,.003,len,std(0x9c8f80,{roughness:1}),s*.17));g.userData.flat=1;return g}
function climbSteps(n){const g=G();const cs=[M.sky,M.rose,M.mustard,M.sage,M.cream];for(let i=0;i<n;i++)bx(g,.9,.22*(i+1),.9,cs[i%cs.length],i*.92-((n-1)*.46));return g}
function snowTree(H){const g=G();cy(g,.18,H,M.walnut);for(let i=0;i<4;i++){const a=i*1.7,h=.9+i*.55;const b=bx(g,.1,.1,1.3,M.walnut,Math.sin(a)*.6,h,Math.cos(a)*.6);b.rotation.y=a;bx(g,.7,.06,.5,M.oakL,Math.sin(a)*1.15,h+.05,Math.cos(a)*1.15,a)}return g}
function coldStone(){const g=G();const s=sp(g,.85,.14,.6,M.granite,0,.05,0,GD);return g}
function snowPile(){const g=G();sp(g,.7,.35,.6,M.snow,0,.1,0);sp(g,.4,.25,.4,M.snow,.4,.12,.25);return g}
function blanket(c){const g=G();bx(g,.6,.08,.42,c);bx(g,.58,.02,.4,c,0,.08,0,.1);return g}
function filmCans(){const g=G();for(let i=0;i<6;i++)cy(g,.17,.04,M.chrome,(i%2)*.06,i*.045,0);return g}
function boxStack(n){const g=G();for(let i=0;i<n;i++)bx(g,.55,.38,.42,pick([M.sand,M.cream]),rr(-.05,.05),i*.38,0,rr(-.15,.15));return g}
function towelMat(){const g=G();bx(g,2.4,.02,1.4,std(0xf6f3ec,{roughness:1}));g.userData.flat=1;return g}
function openBook(){const g=G();const a=bx(g,.18,.01,.24,M.cream,-.08,0,0);a.rotation.z=.2;const b=bx(g,.18,.01,.24,M.cream,.08,0,0);b.rotation.z=-.2;bx(g,.36,.015,.25,M.navy,0,-.015,0);return g}
function plushLeo(){const g=G();const w=std(0xe3e6ea,{roughness:1});sp(g,.14,.11,.2,w,0,.11,0);sp(g,.1,.1,.1,w,0,.18,.18);sp(g,.03,.03,.02,w,-.06,.27,.18);sp(g,.03,.03,.02,w,.06,.27,.18);const t=cy(g,.035,.3,w,0,.08,-.25);t.rotation.x=1.2;return g}
function basket(){const g=G();cy(g,.2,.3,M.sand);sp(g,.18,.08,.18,M.white,0,.3,0,GSL);return g}

T('1F','f1-7',true,'손님은 모두 이 대현관으로 들어오십니다. 발소리가 울리도록 천장을 높였고, 유리 너머 중정을 먼저 보여 드립니다. 정돈된 고죠 가를요. 꽃은 매일 아침 바꿉니다. 겨울엔 동백입니다.');
T('1F','f1-12',true,'대현관에서 이어지는 남측 갤러리입니다. 이 갤러리 끝의 통제문부터는 가족의 공간이라, 손님은 여기서 걸음을 돌리십니다.',null,'통제문 앞에는 늘 한 사람이 서 있습니다. 졸지 않는 사람으로 골라 둡니다.');

T('1F','f1-5',true,'접견실, 당주께서 웃지 않으시는 방입니다.','가훈 족자에는 ‘흔들리지 않는다’고 적혀 있지요. 당주께서는 그 족자를 보실 때마다 웃음을 참으십니다. 손님은 모르십니다.','이 방의 이야기는 이 방을 나가지 않습니다. 벽의 칼이 뽑힌 적이 있느냐고요. 오늘은 눈이 많이 오는군요.');
T('1F','f1-4',true,'서측 회랑입니다. 동쪽 창으로 중정이 보이고, 그 끝에 연회실과 회랑 전실이 있습니다.');
T('1F','f1-2',true,'대연회실입니다. 스무 자리 탁자는 일 년에 열 번도 쓰이지 않습니다. 가장 최근엔 도련님의 돌잔치였고, 그날만은 이 방이 시끄러웠습니다.');

T('1F','f1-9',true,'정식 다이닝룸입니다. 손님과의 식사는 여기서 하고, 가족끼리는 2층에서 따로 드십니다.');

/* ───────── loop ───────── */
const clock=new THREE.Clock();const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),T=clock.elapsedTime;
 if(tween){const k=Math.min(1,(performance.now()-tween.t0)/tween.d),e=ease(k);camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);if(k>=1)tween=null}
 controls.update();
 if(S.snow){const tx=controls.target.x,tz=controls.target.z,by=S.mode==='ext'?-5:controls.target.y-12;snow.position.set(tx,by,tz);const inMode=S.mode!=='ext';const roofY=S.mode==='x'?60:(FL[S.mode]?FL[S.mode].elev+4:0);
  for(let i=0;i<SN;i++){const j=i*3;snowPos[j+1]-=snowV[i]*dt*2.2;snowPos[j]+=Math.sin(T*.6+i)*dt*.5;if(snowPos[j+1]<0)snowPos[j+1]+=SB.h;
   if(inMode){const wx=snowPos[j]+tx,wz=snowPos[j+2]+tz;if(wx>91&&wx<149&&wz>90&&wz<141&&snowPos[j+1]+by<roofY)snowPos[j+1]=SB.h-Math.random()*3}}snowGeo.attributes.position.needsUpdate=true}
 steams.forEach(s=>{const u=s.userData;u.t=(u.t+dt*.18)%1;s.position.set(u.x+Math.sin(T*.5+u.z)*.3*u.t,u.y+u.t*3.2,u.z);const sc=1.2+u.t*2.6;s.scale.set(sc,sc,1);s.material.opacity=Math.sin(u.t*Math.PI)*(S.night?.35:.55)});
 renderer.render(scene,camera);layoutLabels()}

/* ───────── boot ───────── */
function boot(){try{resize();build();apply();const pr=presetFor('ext');camera.position.set(...pr.p);if(camera.aspect<1)camera.position.sub(new THREE.Vector3(...pr.t)).multiplyScalar(1.45).add(new THREE.Vector3(...pr.t));controls.target.set(...pr.t);controls.update();loop();
 $('#loading').classList.add('done');setTimeout(()=>showChapter('ext'),500);setTimeout(()=>$('#loading').remove(),900)}catch(err){console.error(err);$('#loadMsg').innerHTML='<div class="err">저택을 그리는 중에 문제가 생겼어요. 페이지를 새로 고쳐 주세요.<br><small>'+String(err.message||err).replace(/</g,'&lt;')+'</small></div>'}}
const fontWait=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontWait.then(()=>setTimeout(boot,30));
})();
</script>
